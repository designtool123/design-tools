.page.active{display:block}

<script>
const navVinyl=document.getElementById('navVinyl');
const navHeart=document.getElementById('navHeart');
const pageVinyl=document.getElementById('pageVinyl');
const pageHeart=document.getElementById('pageHeart');
function showPage(name){
  const vinyl=name==='vinyl';
  pageVinyl.classList.toggle('active',vinyl);
  pageHeart.classList.toggle('active',!vinyl);
  navVinyl.classList.toggle('active',vinyl);
  navHeart.classList.toggle('active',!vinyl);
}
navVinyl.addEventListener('click',()=>showPage('vinyl'));
navHeart.addEventListener('click',()=>showPage('heart'));
</script>
